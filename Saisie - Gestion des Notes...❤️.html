  </head>
  <body>
    <nav>
      <a href="http://127.0.0.1:5500/gestion/accueil.html">Accueil</a>
      <a href="http://127.0.0.1:5500/gestion/saisie.html" class="active">Saisie des Notes</a>
      <a href="http://127.0.0.1:5500/gestion/resultats.html">Résultats</a>

    <div class="container">
      <div class="card">
        <h2>Nouvel Étudiant</h2>
        <form id="noteForm">
          <div class="form-group">
            <label for="nom">Nom complet de l'étudiant</label>
            <input type="text" id="nom" required="" placeholder="Ex: Marc Antoine">
          </div>
          <div style="display: flex; gap: 1rem">
            <div class="form-group" style="flex: 1">
              <label for="note1">Note 1 (/20)</label>
              <input type="number" id="note1" min="0" max="20" step="0.01" required="" placeholder="12.5">
            </div>
            <div class="form-group" style="flex: 1">
              <label for="note2">Note 2 (/20)</label>
              <input type="number" id="note2" min="0" max="20" step="0.01" required="" placeholder="14">
            </div>
          </div>
          <button type="submit">Calculer et Ajouter</button>
        </form>
      </div>

      <div class="card">
        <h2>Aperçu de la liste (Modifications en direct)</h2>
        <table id="liveTable">
          <thead>
            <tr>
              <th>Étudiant</th>
              <th>Moyenne</th>
              <th>État</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody><tr>
                    <td>yibokou flore</td>
                    <td>15.50 / 20</td>
                    <td><span class="badge admis">Admis</span></td>
                    <td><button class="btn-delete" onclick="supprimerEtudiant(1779732470973)">Supprimer</button></td>
                </tr></tbody>
        </table>
      </div>
    </div>

    <script>
      // Charger la liste existante au démarrage
      document.addEventListener("DOMContentLoaded", loadLiveTable);

      document
        .getElementById("noteForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Récupération des valeurs
          const nom = document.getElementById("nom").value;
          const n1 = parseFloat(document.getElementById("note1").value);
          const n2 = parseFloat(document.getElementById("note2").value);

          // Calculs
          const moyenne = ((n1 + n2) / 2).toFixed(2);
          const etat = moyenne >= 10 ? "Admis" : "Ajourné";

          // Création de l'objet étudiant
          const etudiant = {
            id: Date.now(), // ID unique pour la suppression
            nom: nom,
            note1: n1,
            note2: n2,
            moyenne: moyenne,
            etat: etat,
          };

          // Récupérer le tableau existant dans localStorage ou en créer un vide
          let listeEtudiants =
            JSON.parse(localStorage.getItem("etudiants")) || [];
          listeEtudiants.push(etudiant);

          // Sauvegarder dans le localStorage (Fait circuler les données)
          localStorage.setItem("etudiants", JSON.stringify(listeEtudiants));

          // Mettre à jour l'affichage en direct
          loadLiveTable();

          // Réinitialiser le formulaire
          document.getElementById("noteForm").reset();
        });

      function loadLiveTable() {
        const tbody = document.querySelector("#liveTable tbody");
        tbody.innerHTML = ""; // Efface le tableau actuel

        const listeEtudiants =
          JSON.parse(localStorage.getItem("etudiants")) || [];

        listeEtudiants.forEach((etudiant) => {
          const tr = document.createElement("tr");
          const badgeClass = etudiant.etat === "Admis" ? "admis" : "ajourne";

          tr.innerHTML = `
                    <td>${etudiant.nom}</td>
                    <td>${etudiant.moyenne} / 20</td>
                    <td><span class="badge ${badgeClass}">${etudiant.etat}</span></td>
                    <td><button class="btn-delete" onclick="supprimerEtudiant(${etudiant.id})">Supprimer</button></td>
                `;
          tbody.appendChild(tr);
        });
      }

      // Fonction pour supprimer dynamiquement une ligne
      function supprimerEtudiant(id) {
        let listeEtudiants =
          JSON.parse(localStorage.getItem("etudiants")) || [];
        // Filtrer pour retirer l'élément supprimé
        listeEtudiants = listeEtudiants.filter((e) => e.id !== id);
        localStorage.setItem("etudiants", JSON.stringify(listeEtudiants));

        // Recharger la liste dans le DOM
        loadLiveTable();
      }
    </script>
